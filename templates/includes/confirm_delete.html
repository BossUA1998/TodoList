<div class="row justify-content-center mt-5">
  <div class="col-md-6">
    <div class="card border-danger mb-3" style="background-color: #1e1e1e;">
      <div class="card-header bg-danger text-white">
        <h4 class="mb-0">⚠️ Confirm delete</h4>
      </div>
      <div class="card-body text-center">
        <p class="lead">Are you sure you want to delete this item?</p>
        <p class="text-muted small">This action cannot be undone.</p>

        <form action="" method="post">
          {% csrf_token %}
          <div class="d-flex justify-content-center mt-4">
            <a href="javascript:history.back()" class="btn btn-outline-secondary mr-3">Cancel</a>
            <input type="submit" value="Delete" class="btn btn-danger px-5">
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
