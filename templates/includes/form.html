{% load crispy_forms_filters %}

<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-lg" style="background-color: #1e1e1e; border: 1px solid #333;">
      <div class="card-header border-0 pb-0 pt-4" style="background-color: transparent;">
        <h2 class="text-center mb-0 font-weight-bold">
          {{ object|yesno:"Update,Create" }}
        </h2>
      </div>

      <div class="card-body">
        <form action="" method="post">
          {% csrf_token %}

          {{ form|crispy }}

          <div class="mt-4">
            <input type="submit"
                   value="{{ object|yesno:"Update,Create" }}"
                   class="btn btn-primary btn-block btn-lg">
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
