{% extends "base.html" %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3">Tags</h1>
    <a href="{% url 'deal:tags-create' %}" class="btn btn-primary">
      + Add Tag
    </a>
    </div>

  <div class="table-responsive">
    <table class="table table-dark-custom table-hover">
      <thead>
        <tr>
          <th style="width: 60%;">Name</th>
          <th style="width: 20%;" class="text-center">Update</th>
          <th style="width: 20%;" class="text-center">Delete</th>
        </tr>
      </thead>
      <tbody>
        {% for tag in tag_list %}
          <tr>
            <td class="font-weight-bold">
              <span class="badge badge-secondary p-2">{{ tag.name }}</span>
            </td>
            <td class="text-center">
              <a href="{% url 'deal:tags-update' pk=tag.pk %}" class="btn btn-sm btn-outline-info">
                Update
              </a>
            </td>
            <td class="text-center">
              <a href="{% url 'deal:tags-delete' pk=tag.pk %}" class="btn btn-sm btn-outline-danger">
                Delete
              </a>
            </td>
          </tr>
        {% empty %}
          <tr>
            <td colspan="3" class="text-center text-muted">No tags available.</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
