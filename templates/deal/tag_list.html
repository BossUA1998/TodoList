{% extends "base.html" %}

{% block content %}
  <h1>Tags</h1>
  <a href="{% url 'deal:task-create' %}">Create tag</a>
  <table>
    <tr>
      <th>Name</th>
      <th>Update</th>
      <th>Delete</th>
    </tr>
    {% for tag in tag_list %}
      <tr>
        <td>
          {{ tag.name }}
        </td>
        <td>
          Update ---
        </td>
        <td>
          Delete ---
        </td>
      </tr>
    {% endfor %}
  </table>
{% endblock %}
