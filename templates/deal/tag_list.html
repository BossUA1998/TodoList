{% extends "base.html" %}

{% block content %}
  <h1>Tags</h1>
  <a href="{% url 'deal:task-create' %}">Add</a>
  <table>
    <tr>
      <th>Name</th>
      <th>Update</th>
      <th>Delete</th>
    </tr>
    {% for tag in tag_list %}
      <tr>
        <td>
          {{ tag.name }}
        </td>
        <td>
          <a href="{% url 'deal:tags-update' pk=tag.pk %}">
            Update
          </a>
        </td>
        <td>
          <a href="{% url 'deal:tags-delete' pk=tag.pk %}">
            Delete
          </a>
        </td>
      </tr>
    {% endfor %}
  </table>
{% endblock %}
